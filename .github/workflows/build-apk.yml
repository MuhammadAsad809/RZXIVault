name: Build RZXIVault APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RZXIVault-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: RZXIVault v1.0.0 (Build ${{ github.run_number }})
          body: |
            ### RZXIVault - Offline Biometric Encrypted Vault
            
            **Autonomous Build Artifact**
            - **Hardware Root of Trust**: Android Keystore (StrongBox / TEE)
            - **Storage Cryptography**: SQLCipher 256-bit AES + HMAC-SHA512
            - **Zero Network Surface**: 100% Air-Gapped (Zero `INTERNET` permission)
            - **Biometric Enforcement**: AndroidX BiometricPrompt (`AUTH_BIOMETRIC_STRONG`)
            
            Generated deterministically via GitHub Actions.
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
